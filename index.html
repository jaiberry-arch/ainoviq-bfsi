<script>
/* Theme, resolved before first paint. nx-theme = mode (auto | light | dark); nx-dark = style used whenever dark is active. */
(function(){
  var D = document.documentElement, STYLES = ["midnight","graphite","black","dimmed","contrast"], MODES = ["auto","light","dark"];
  var PAPER = {light:"#F6F7FB", midnight:"#0A1030", graphite:"#16171A", black:"#000000", dimmed:"#1F2633", contrast:"#040817"};
  var mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
  function read(k, d){ try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e){ return d; } }
  function write(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  var T = window.__theme = {
    styles: STYLES, defaultDark: "midnight", mode: "auto", dark: "midnight",
    resolved: function(){ return T.mode === "auto" ? (mq && mq.matches ? "dark" : "light") : T.mode; },
    apply: function(){
      var r = T.resolved();
      D.setAttribute("data-theme", r); D.setAttribute("data-dark", T.dark); D.setAttribute("data-mode", T.mode);
      var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", PAPER[r === "dark" ? T.dark : "light"]);
    },
    set: function(mode, dark){
      if (MODES.indexOf(mode) > -1) T.mode = mode;
      if (STYLES.indexOf(dark) > -1) T.dark = dark;
      write("nx-theme", T.mode); write("nx-dark", T.dark); T.apply();
    }
  };
  var m = read("nx-theme", "auto"), d = read("nx-dark", "midnight");
  T.mode = MODES.indexOf(m) > -1 ? m : "auto"; T.dark = STYLES.indexOf(d) > -1 ? d : "midnight";
  T.apply();
  if (mq){ var f = function(){ if (T.mode === "auto"){ T.apply(); document.dispatchEvent(new Event("themechange")); } }; if (mq.addEventListener) mq.addEventListener("change", f); else if (mq.addListener) mq.addListener(f); }
})();
</script>

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 140px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

/* Header, tabs, call strip */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.progress{height:3px;background:var(--line)}
.progress__bar{height:100%;background:var(--blue);width:0;transition:width .35s ease}
.top__row{display:flex;align-items:center;gap:14px;max-width:980px;margin:0 auto;padding:12px 20px 6px}
.brand{font-family:var(--head);font-weight:900;font-size:20px;letter-spacing:-.02em}
.brand{display:flex;align-items:center}
.brand__logo{display:block;height:22px;aspect-ratio:296/58;background:var(--ink);-webkit-mask:url(/assets/ainoviq-wordmark.png) center/contain no-repeat;mask:url(/assets/ainoviq-wordmark.png) center/contain no-repeat}
.brand span{font-weight:500;color:var(--muted);font-size:14px;margin-left:10px;letter-spacing:0}
.top__spacer{flex:1}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--blue);background:transparent;border:1.5px solid var(--blue);border-radius:999px;padding:4px 10px;white-space:nowrap}
.updated{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:2px;max-width:980px;margin:0 auto;padding:4px 14px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:0;background:none;padding:8px 10px 11px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs .n{font-family:var(--mono);display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);font-size:11px;font-weight:700}
.tabs button.seen .n{border-color:var(--blue);color:var(--blue)}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--blue)}
.tabs button[aria-current="page"] .n{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.strip{max-width:980px;margin:0 auto;padding:8px 20px 10px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.strip b{color:var(--ink);font-weight:600}
.strip button{border:0;background:none;color:var(--blue);font-weight:600;font-size:12.5px;cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}

/* Page */
main{max-width:980px;margin:0 auto;padding:26px 20px 80px}
main:focus{outline:none}
.page{animation:pagein .28s ease}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.page{animation:none}}
.stepno{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 6px}
.page > h1{font-family:var(--head);font-size:28px;line-height:1.15;letter-spacing:-.025em;margin:0 0 10px;font-weight:800}
.intro{font-size:16px;margin:0 0 10px;max-width:70ch}
.gets{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);margin:0 0 26px;max-width:70ch}
.gets b{color:var(--ink);font-weight:600;white-space:nowrap}
h2.sec{font-family:var(--head);font-size:18px;font-weight:800;margin:34px 0 6px;letter-spacing:-.015em}
.sec__lead{color:var(--muted);margin:0 0 12px;max-width:70ch;font-size:14.5px}
h3{font-family:var(--head);font-size:15px;font-weight:700;margin:20px 0 8px;letter-spacing:-.01em}
.hint{font-size:13px;color:var(--muted)}
.pagenav{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:18px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:9px 14px;font-size:14px;cursor:pointer;font-weight:500;text-align:left}
.btn small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.btn--primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue);text-align:right}
.btn--primary small{color:inherit;opacity:.8}
.btn--sm{padding:4px 10px;font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Choices */
.stage{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);padding:16px 18px;margin:0 0 14px}
.stage__head{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.stage__n{font-family:var(--mono);font-weight:700;font-size:12px;width:24px;height:24px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:inline-grid;place-items:center;flex:0 0 auto}
.stage__t{font-family:var(--head);font-weight:800;font-size:15.5px;letter-spacing:-.01em}
.stage__done{margin-left:auto;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.choice{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-m);padding:12px 14px}
.choice:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.choice b{display:block;font-weight:600;font-size:14.5px;margin-bottom:3px}
.choice span{display:block;font-size:13px;color:var(--muted);line-height:1.45}
.choice em{display:inline-block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--blue);background:var(--tint);border-radius:999px;padding:1px 8px;margin-top:6px}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--tint)}
.choice[aria-pressed="true"] em{background:var(--surface)}
.choice[aria-pressed="true"] b::after{content:"Selected";font-size:11px;font-weight:600;color:var(--blue);margin-left:8px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);gap:2px;margin:0 0 14px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink)}

/* Content blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;margin:0 0 10px}
.card p{margin:0 0 6px;font-size:14.5px}
.card p:last-child{margin-bottom:0}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px;font-size:14.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.list{margin:6px 0 0;padding-left:1.2em}
.list li{margin:5px 0;font-size:14.5px}
.tip{background:var(--tint);border-radius:var(--r-m);padding:11px 14px;font-size:14px;margin:0 0 12px}
.warn{background:var(--surface);border:1.5px solid var(--blue);border-radius:var(--r-m);padding:11px 14px;font-size:14px;margin:0 0 12px}
.notice{background:var(--surface);border:1.5px dashed var(--line-strong);border-radius:var(--r-m);padding:11px 14px;font-size:14px;margin:0 0 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notice b{margin-right:4px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 10px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.1;color:var(--blue);font-weight:700;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.bad,.good{border-radius:var(--r-m);padding:10px 12px;font-size:14px}
.bad{background:var(--surface);border:1.5px dashed var(--line-strong);color:var(--muted)}
.good{background:var(--tint);border-left:3px solid var(--blue)}
.bad b,.good b{display:block;font-size:12px;margin-bottom:2px}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 14px;margin:0 0 8px}
details.more > summary{cursor:pointer;font-weight:600;font-size:14.5px}
details.more[open] > summary{margin-bottom:8px}
.gloss{display:grid;grid-template-columns:190px minmax(0,1fr);gap:6px 16px;font-size:14px;margin:0}
.gloss dt{font-weight:600}
.gloss dd{margin:0;color:var(--muted)}

/* Spoken lines */
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 14px;border-left:3px solid var(--blue);background:var(--surface);border-radius:0 var(--r-s) var(--r-s) 0;margin:8px 0}
.line__text{font-family:var(--say);font-size:17px;line-height:1.6;max-width:70ch}
.line__label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:4px}
.line--ask{background:var(--tint)}
.line--they{background:transparent;border:1px dashed var(--line);border-left:3px solid var(--muted)}
.line--they .line__text{font-family:var(--ui);font-size:15px;color:var(--muted)}
.line--note{border-left-color:var(--ok);background:var(--ok-t)}
.line--note .line__text{font-family:var(--ui);font-size:14px}
.copy{border:1px solid var(--line);background:var(--paper);border-radius:var(--r-s);font-size:12px;padding:4px 9px;cursor:pointer;color:var(--muted)}
.copy:hover{color:var(--ink)}
.copy.done{color:var(--ok);border-color:var(--ok)}
mark.ph{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px}
.filled{border-bottom:2px solid var(--blue)}
.parts{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 14px;font-size:14px;margin:6px 0 0}
.parts dt{color:var(--muted);font-weight:500}
.parts dd{margin:0}
.qs{list-style:none;padding:0;margin:8px 0}
.qs li{margin:6px 0}
.qs button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;font-family:var(--say);font-size:16.5px;line-height:1.55;padding:9px 12px;border-radius:var(--r-s);background:var(--tint);border-left:3px solid var(--blue)}
.qs button:focus-visible{outline:2px solid var(--focus)}
.qs button[aria-pressed="true"]{text-decoration:line-through;color:var(--muted);background:transparent}
.qs small{display:block;font-family:var(--ui);font-size:12.5px;color:var(--muted);text-decoration:none}

/* Tables and pills */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
tr.here td{background:var(--tint)}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill--ok{background:var(--tint);color:var(--tint-ink);border:1.5px solid transparent}
.pill--warn{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.pill--stop{background:var(--solid);color:var(--solid-ink);border:1.5px solid var(--solid)}

/* Objections */
.obj{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);margin:0 0 8px}
.obj > summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.obj > summary::-webkit-details-marker{display:none}
.obj > summary b{font-weight:600}
.obj > summary .tag{font-size:12px;color:var(--muted);white-space:nowrap}
.obj > summary .tag.hot{color:var(--blue);font-weight:600}
.obj__body{padding:0 14px 14px}
.why{font-size:14px;color:var(--muted);margin:0 0 6px}
.drill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:22px 20px;text-align:left}
.drill__say{font-family:var(--say);font-size:22px;line-height:1.4;margin:6px 0 14px}

/* Live call */
.step{padding:6px 0 18px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.flowmap{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:0 0 18px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.flowmap__node{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.flowmap__node span{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:inline-grid;place-items:center;font-size:9.5px;font-weight:700}
.flowmap__node.done{color:var(--ink)}
.flowmap__node.done span{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.flowmap__node.on{color:var(--ink);font-weight:700}
.flowmap__node.on span{border-color:var(--blue);color:var(--blue)}
.flowmap__line{width:18px;height:1.5px;background:var(--line);margin:0 4px}
.flowmap__line.done{background:var(--blue)}
@media (max-width:760px){.flowmap{overflow-x:auto;flex-wrap:nowrap}}
.step__head{display:flex;align-items:baseline;gap:10px;margin:10px 0 2px}
.step__n{font-size:12px;color:var(--blue);font-weight:600;min-width:22px}
.step__t{font-size:15px;font-weight:600}
.step.past{opacity:.6}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,20px);background:var(--solid);color:var(--solid-ink);padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.flowmap__end{margin-left:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--solid);color:var(--solid-ink)}
.strip .ready{margin-left:auto}
.success{display:flex;gap:12px;align-items:flex-start;background:var(--tint);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px;margin:6px 0 14px}
.success__icon{width:30px;height:30px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;flex:0 0 auto;font-size:16px;font-weight:800}
.success h4{margin:0 0 3px;font-family:var(--head);font-weight:800;font-size:15px}
.success p{margin:0;font-size:13.5px;color:var(--muted)}
.responses{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.responses__label{width:100%;font-size:13px;color:var(--muted)}
.resp{border:1.5px solid var(--blue);background:var(--surface);color:var(--blue);padding:8px 14px;border-radius:999px;font-weight:500;font-size:14px;cursor:pointer}
.resp:hover{background:var(--tint)}
.resp--quiet{border-color:var(--line);color:var(--muted)}
.callcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:20px 22px}
.callcard h2{font-family:var(--head);font-weight:800;font-size:20px;margin:0 0 4px;letter-spacing:-.015em}
.callcard .meta{font-size:13px;color:var(--muted);margin:0 0 14px}
.callcard h3{font-size:13px;text-transform:none;color:var(--blue);margin:16px 0 4px}
.callcard .say{font-family:var(--say);font-size:16px;line-height:1.55;margin:0}
.callcard ol{margin:4px 0 0;padding-left:1.3em;font-family:var(--say);font-size:15.5px;line-height:1.55}
.callcard .objs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.callcard .objs div{border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;font-size:14px}
.callcard .objs b{display:block;margin-bottom:3px}

/* Channel stepper: one channel on screen at a time */
.channels{display:flex;align-items:center;gap:0;max-width:980px;margin:0 auto;padding:10px 20px 8px;overflow-x:auto;scrollbar-width:none}
.channels::-webkit-scrollbar{display:none}
.chan{display:flex;align-items:center;gap:9px;border:0;background:none;padding:6px 4px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.chan__n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);font-family:var(--mono);font-size:11.5px;font-weight:700;flex:0 0 auto;transition:background .2s,border-color .2s,color .2s}
.chan__t{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.chan__t small{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);opacity:.85}
.chan.done .chan__n{background:var(--tint);border-color:var(--blue);color:var(--blue)}
.chan[aria-current="step"]{color:var(--ink)}
.chan[aria-current="step"] .chan__n{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.chan__line{flex:1 1 28px;min-width:18px;height:1.5px;background:var(--line);margin:0 10px}
.chan__line.done{background:var(--blue)}
.tabs.hidden{display:none}
/* Channel hero */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 22px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--blue)}
.hero__icon{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--blue);display:grid;place-items:center;font-family:var(--head);font-weight:900;font-size:17px}
.hero h2{font-family:var(--head);font-weight:800;font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.hero p{margin:0;font-size:14.5px;color:var(--muted);max-width:66ch}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:0 0 20px}
.rules div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px;font-size:13.5px}
.rules b{display:block;font-family:var(--head);font-weight:800;font-size:13.5px;margin-bottom:2px}
/* Message cards */
.msg{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 12px;overflow:hidden}
.msg__head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.msg__step{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--blue)}
.msg__title{font-weight:600;font-size:14px}
.msg__when{margin-left:auto;font-size:12.5px;color:var(--muted)}
.msg__body{padding:14px 16px;font-family:var(--say);font-size:15.5px;line-height:1.6;white-space:pre-line}
.msg__subj{font-family:var(--ui);font-size:13.5px;color:var(--muted);margin:0 0 8px}
.msg__subj b{color:var(--ink);font-weight:600}
.msg__foot{display:flex;align-items:center;gap:10px;padding:8px 14px 12px}
.count{font-family:var(--mono);font-size:11px;color:var(--muted)}
.count.over{color:var(--blue);font-weight:700}
.handoff{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--tint);border-radius:12px;padding:16px 18px;margin:26px 0 0}
.handoff p{margin:0;font-size:14.5px;max-width:60ch}
.lvl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.lvl button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;color:var(--ink);font-weight:500}
.lvl button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:var(--blue-ink)}
.lvl button .arrow{opacity:.75;margin-left:6px}
.lvl button[aria-pressed="true"] .arrow{opacity:1}
@media (max-width:560px){.hero{grid-template-columns:1fr}.chan__t small{display:none}}

@media (max-width: 760px){
  .updated{display:none}
  .grid3,.grid2,.pairs,.callcard .objs{grid-template-columns:1fr}
  .kv,.parts,.gloss{grid-template-columns:1fr}
  .kv dt,.parts dt,.gloss dt{margin-top:6px}
}
@media (max-width: 560px){
  .brand span{display:none}
  .line{grid-template-columns:1fr}
  .line .copy{justify-self:start}
  .line__text{font-size:16px}
  .page > h1{font-size:24px}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important} }

/* ===== UI polish layer ===== */
:root{--r-l:14px;--ease:cubic-bezier(.2,.7,.2,1)}
body{font-size:15.5px;line-height:1.6}
main{padding-top:30px}
/* Header: glassy, lighter, shorter */
.top{background:var(--header-bg);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);box-shadow:0 1px 0 var(--line)}
.top{border-bottom:0}
.progress{height:3px;background:transparent}
.progress__bar{background:linear-gradient(90deg,var(--accent-2),var(--blue));border-radius:0 3px 3px 0}
.top__row{padding:10px 20px 2px}
.strip{border-top:0;padding:4px 20px 10px;gap:6px 8px}
.strip > span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px;white-space:nowrap}
.strip > span.ready{background:var(--tint);border-color:transparent;color:var(--tint-ink)}
.strip button{padding:0 2px;font-size:12.5px}
.channels{padding-top:8px;padding-bottom:6px}
.chan{border-radius:8px;padding:6px 8px;transition:background .15s,color .15s}
.chan:hover{background:var(--tint);color:var(--ink)}
.tabs button{transition:color .15s,border-color .15s;border-radius:8px 8px 0 0}
.tabs button:hover{color:var(--ink);background:var(--tint)}
/* Headings */
.page > h1{font-size:clamp(26px,4vw,34px);letter-spacing:-.03em}
.intro{font-size:16.5px;color:var(--ink)}
.gets{background:var(--tint);border-radius:var(--r-m);padding:10px 14px;max-width:none;width:fit-content;margin-bottom:24px}
h2.sec{font-size:20px;margin-top:40px;padding-bottom:8px;border-bottom:1px solid var(--line)}
/* Buttons */
.btn{transition:background .15s,border-color .15s,box-shadow .15s,transform .1s var(--ease);box-shadow:var(--shadow-1);min-height:40px}
.btn:hover{border-color:var(--blue);box-shadow:var(--shadow-2)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn--primary:hover{background:var(--blue-hover);border-color:var(--blue-hover)}
.btn--sm{min-height:32px}
.copy{min-height:30px;padding:4px 12px;font-weight:500;transition:all .15s}
.copy:hover{border-color:var(--blue);color:var(--blue);background:var(--tint)}
.resp{transition:background .15s,transform .1s var(--ease);min-height:40px}
.resp:active{transform:scale(.97)}
.seg button,.lvl button{transition:background .15s,color .15s,border-color .15s}
.lvl button:hover:not([aria-pressed="true"]){border-color:var(--blue)}
/* Cards and choices */
.stage,.card,.msg,.obj,.callcard,.drill,.hero,.flowmap,details.more{border-radius:var(--r-l);box-shadow:var(--shadow-1)}
.stage{padding:20px 22px;margin-bottom:18px}
.stage__head{margin-bottom:14px}
.stage__done{background:var(--tint);color:var(--tint-ink);padding:2px 9px;border-radius:999px}
.choice{border-radius:12px;padding:14px 16px;position:relative;transition:border-color .15s,background .15s,box-shadow .15s,transform .15s var(--ease)}
.choice:hover{border-color:var(--blue);box-shadow:var(--shadow-2);transform:translateY(-1px)}
.choice:active{transform:none}
.choice[aria-pressed="true"]{box-shadow:0 0 0 1px var(--blue),var(--shadow-1)}
.choice[aria-pressed="true"] b::after{content:"\2713";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--blue);color:var(--blue-ink);font-size:11px;margin-left:8px;vertical-align:1px}
.field input,.field select{min-height:42px;border-radius:8px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.search:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
.search{width:100%;min-height:44px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);margin:0 0 12px}
.obj{transition:border-color .15s}
.obj:hover,.obj[open]{border-color:var(--blue)}
.obj > summary{padding:14px 16px}
.obj > summary::after{content:"+";font-weight:700;color:var(--blue);margin-left:auto;padding-left:10px}
.obj[open] > summary::after{content:"\2212"}
details.more > summary{padding:2px 0}
.line{border-radius:0 10px 10px 0;box-shadow:var(--shadow-1)}
.msg__head{border-radius:var(--r-l) var(--r-l) 0 0}
.toast{box-shadow:var(--shadow-2)}
table{font-size:14px}
tbody tr:hover td{background:var(--tint)}
/* Pagination: sticky on phones so Next is always reachable */
@media (max-width:760px){
  main{padding:20px 16px 110px}
  .top__row{padding:8px 16px 0}
  .channels{padding:6px 12px 4px}
  .strip{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px 16px 8px}
  .strip::-webkit-scrollbar{display:none}
  .strip .ready{margin-left:0}
  .stage{padding:16px}
  .choice,.tabs button,.chan,.seg button,.lvl button{min-height:44px}
  .pagenav{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--paper) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .pagenav .btn{flex:1}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
  .gets{display:flex}
}
@media (max-width:420px){.badge{display:none}}
@media (prefers-reduced-motion: reduce){.choice,.btn,.resp{transition:none!important;transform:none!important}}
@media print{.pagenav{position:static}}

/* Appearance button + popover */
.appear{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px 6px 10px;font-size:13px;font-weight:500;cursor:pointer;min-height:34px;transition:border-color .15s,background .15s}
.appear:hover{border-color:var(--blue)}
.appear__icon{display:grid;place-items:center;width:16px;height:16px;color:var(--blue)}
.appear__icon svg{width:16px;height:16px}
.appearance{position:fixed;inset:auto;top:calc(env(safe-area-inset-top,0px) + 54px);right:max(16px,calc((100vw - 980px) / 2 + 20px));margin:0;width:min(340px,calc(100vw - 32px));max-height:calc(100dvh - 80px);overflow:auto;padding:14px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);color:var(--ink);box-shadow:var(--shadow-2),0 18px 48px rgba(0,0,0,.18)}
.appearance:popover-open{animation:popin .16s var(--ease)}
@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.appearance__title{font-family:var(--head);font-weight:800;font-size:15px;margin:2px 2px 10px}
.appearance fieldset{border:0;margin:0 0 12px;padding:0;min-width:0}
.appearance legend{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:0 2px;margin-bottom:6px}
.appearance input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.modes__pill{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.modes label{flex:1 1 0;position:relative;text-align:center;border-radius:999px;padding:7px 6px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.modes label:hover{color:var(--ink)}
.modes label:has(input:checked){background:var(--blue);color:var(--blue-ink)}
.appearance label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.styles{display:grid;gap:6px}
.sw{position:relative;display:flex;align-items:center;gap:12px;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
.sw:hover{border-color:var(--blue)}
.sw:has(input:checked){border-color:var(--blue);background:var(--tint)}

/* ---- Step-by-step call. Each step remembers its own use case, so history never rewrites itself. ---- */
const STEP_T = {perm:"Ask permission", open:"Your opener", fallback:"Not that problem? Try the others", what:"“What exactly do you do?”", questions:"Your questions", amber:"Make it clearer", covered:"“It’s covered”", value:"Value pitch", ask:"Ask for the meeting",

function flowMap(){
  const steps = call.steps, last = steps[steps.length - 1];

function stepBody(s, last, idx){

    case "fallback": {
      const alts = ucs().filter(x => x.seg === u.seg && x.id !== u.id).sort((a, b) => (b.core ? 1 : 0) - (a.core ? 1 : 0)).slice(0, 2);
      if (alts.length){

    case "what": h += line(u.what); h += line("One sentence, then go straight to your first question.", "note"); resp = [["Carry on",{k:"questions"}]]; break;

  auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'
};
function syncAppearance(){
  const resolved = TH.resolved(), styleName = $('input[name="theme-dark"][value="' + TH.dark + '"] + .sw__prev + .sw__txt b').textContent;
  document.querySelectorAll('input[name="theme-mode"]').forEach(i => { i.checked = i.value === TH.mode; });
  document.querySelectorAll('input[name="theme-dark"]').forEach(i => { i.checked = i.value === TH.dark; });
  $("#themeBtn .appear__icon").innerHTML = MODE_ICON[TH.mode === "auto" ? "auto" : resolved];
  $("#themeBtn .appear__lbl").textContent = resolved === "dark" ? (TH.mode === "auto" ? "System" : styleName) : MODE_NAME[TH.mode];
  $("#themeBtn").setAttribute("aria-label", "Appearance: " + MODE_NAME[TH.mode] + (resolved === "dark" ? ", " + styleName : ", light"));
  $("#themeHint").textContent = TH.mode === "light" ? "Dark styles apply in dark mode. Picking one switches to Dark."
    : TH.mode === "auto" ? "Following your system, which is " + resolved + " right now." : "Saved on this device.";
}
$("#themePanel").addEventListener("change", e => {
  const t = e.target;
  if (t.name === "theme-mode") TH.set(t.value);
  else if (t.name === "theme-dark") TH.set(TH.resolved() === "light" ? "dark" : TH.mode, t.value);
  syncAppearance();
});
$("#themePanel").addEventListener("toggle", e => { if (e.newState === "open"){ const c = $('#themePanel input[name="theme-mode"]:checked'); if (c) c.focus(); } });
document.addEventListener("themechange", syncAppearance);

/* Arrow keys switch tabs only from the page itself or the tab bar, never while a card, field or button inside the page has focus */
document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const a = document.activeElement;
  const ok = !a || a === document.body || a.id === "page" || (a.closest && a.closest("#tabs"));
  if (!ok) return;
  const idx = TABS.findIndex(t => t.k === S.tab);
  if (e.key === "ArrowRight" && idx < TABS.length - 1){ go(TABS[idx + 1].k); e.preventDefault(); }
  if (e.key === "ArrowLeft" && idx > 0){ go(TABS[idx - 1].k); e.preventDefault(); }
});

syncAppearance(); normalise(); if (!PAGES[S.tab]) S.tab = "markets"; render(false);

</script>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
